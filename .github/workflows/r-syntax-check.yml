name: R syntax check

on:
  push:
  pull_request:

jobs:
  parse-r-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.2'
      - name: Parse all R scripts
        shell: Rscript {0}
        run: |
          files <- list.files("R", pattern = "[.]R$", recursive = TRUE, full.names = TRUE)
          failures <- vapply(files, function(path) {
            tryCatch({ parse(path); FALSE }, error = function(e) {
              message(path, ": ", conditionMessage(e))
              TRUE
            })
          }, logical(1))
          if (any(failures)) stop("One or more R scripts failed to parse.")

